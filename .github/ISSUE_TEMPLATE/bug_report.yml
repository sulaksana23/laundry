name: Laporan bug
description: Laporkan perilaku yang tidak sesuai
title: "bug: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Ringkasan
      description: Jelaskan masalah secara singkat.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Langkah reproduksi
      placeholder: 1. Buka ... 2. Pilih ... 3. Masalah terlihat ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Hasil yang diharapkan
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Browser dan versi aplikasi
