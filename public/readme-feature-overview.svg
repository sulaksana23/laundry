<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">LaundryOS — pratinjau sistem operasional</title>
  <desc id="desc">Pratinjau dashboard LaundryOS dengan navigasi modul, ringkasan kosong, daftar pesanan, dan cakupan layanan laundry.</desc>
  <defs>
    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d7fb85"/><stop offset="1" stop-color="#a7d94c"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#171d19"/><stop offset="1" stop-color="#111613"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity=".35"/></filter>
    <style>
      text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .muted{fill:#929d95}.soft{fill:#b6c0b7}.white{fill:#f4f7f4}.lime{fill:#d7fb85}
      .tiny{font-size:10px}.small{font-size:12px}.label{font-size:10px;font-weight:700;letter-spacing:1.35px}
      .title{font-size:47px;font-weight:720;letter-spacing:-1.8px}.heading{font-size:15px;font-weight:650}
    </style>
  </defs>
